<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body>

    <header class="flex items-center justify-between w-full h-15 px-4 bg-white border-b border-[#E7E8E8]">
  <!-- Logo Section -->
  <div class="flex items-center gap-2">
    <img src="./assets/Logo Container.png" alt="Serenia Logo" class="">
  </div>

  <!-- Hamburger Button -->
  <button 
    type="button" 
    class="flex items-center justify-center w-10 h-10 bg-gray-100 border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-200 focus:outline-none transition-colors"
    aria-label="Toggle menu"
  >
    <!-- Hamburger Icon -->
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
  </header>

  <div class="mt-9 ml-4 w-85 mb-20">
    <div class="inline-flex items-center gap-2 h-8 w-50 px-2 py-2 bg-amber-200/60 border border-amber-200/60 ">
    <img src="./assets/gold-award-laurel-wreath-accessories-decoration-chandelier 1.png" alt="">
    <span class="text-xs font-semibold text-amber-900 tracking-wide">
    Winner of the IPA 2025
  </span>
  </div>
  <h1 class="text-5xl mt-3 ">Timeless living <br> modern touch</h1>

  <p class="mt-3 font-normal ">Explore thoughtfully designed residences  <br>that combine comfort, style, and a sense <br> of belonging.</p>
</div>

<div class="w-full  max-w-85.75  p-4 h-105 mx-auto shadow-[0_3px_8px_rgba(0,0,0,0.24)] relative ">
  <div class="inline-flex items-center gap-2 h-8  px-2 py-2">
    <img src="./assets/Preference Icon.png" alt=""> 
<span class=" font-semibold  tracking-wide ">
    Find your house preference
  </span>
</div>

<!-- Cluster Field -->
<div class="flex flex-col gap-2 mt=20 px-2 py-2">
  <label for="cluster" class="text-xs text-gray-500 font-semibold">Cluster</label>
  
  <div class="relative w-full">
    <select 
      id="cluster" 
      class="w-full h-11 px-3 bg-white border border-gray-200 text-sm text-gray-800 appearance-none focus:outline-none focus:border-gray-400"
    >
      <option value="ardenia-park">Ardenia park</option>
    </select>
    
    <!-- Dropdown Arrow Icon -->
    <img src="./assets/Vector.png" alt="" class="w-2 h-2 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
  </div>

  <br>  
    <!-- prince range Field -->
<div class="flex flex-col gap-1 -mt-8">
  <label for="cluster" class="text-xs text-gray-500 font-semibold">Price range</label>
  <div class="relative w-full">
    <select 
      id="price-range" 
      class="w-full h-11 px-3 bg-white border border-gray-200 text-sm text-gray-800 appearance-none focus:outline-none focus:border-gray-400"
    >
      <option value="ardenia-park">$85.000 - $120.000</option>
    </select>
    
    <!-- Dropdown Arrow Icon -->
    <img src="./assets/Vector.png" alt="" class="w-2 h-2 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
  </div>
</div>
<br>


<!-- bedroom -->
<div class="flex flex-col gap-1 -mt-8">
  <label for="cluster" class="text-xs text-gray-500 font-semibold">Bedroom</label>
  <div class="relative w-full">
    <select 
      id="Bedroom" 
      class="w-full h-11 px-3 bg-white border border-gray-200 text-sm text-gray-800 appearance-none focus:outline-none focus:border-gray-400"
    >
      <option value="Enter-address">3</option>
    </select>
    
    <!-- Dropdown Arrow Icon -->
    <img src="./assets/Vector.png" alt="" class="w-2 h-2 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
  </div>
</div>

<br>
<!-- Address Input Field (No Icon) -->
<div class="flex flex-col gap-1 -mt-8">
  <label for="address" class="text-xs font-semibold text-gray-500">Address</label>

  <div class="relative w-full">
    <!-- Image Icon (Left Aligned) -->
    <img 
      src="./assets/search-line.png" 
      alt="Search" 
      class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" 
    />

  <input 
    id="address"
    type="text" 
    placeholder="Enter address" 
    class="w-full h-11 px-8 bg-white border border-gray-200 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-gray-400"
  />
</div>

<button class="h-11 px-3 mt-4 text-sm text-white bg-[#56593B]">
    Show the result
</button>

<br>
<img src="./assets/homepage 1.png" alt="" class="w-screen h-auto relative left-1/2 -translate-x-1/2 max-w-none object-cover">

<h1 class="text-center text-[28px] leading-[120%] font-medium text-[#141414] my-10">
  Discover signature communities
</h1>

<div class="relative h-100 w-85 mx-auto -ml-6 shadow-[0_3px_8px_rgba(0,0,0,0.24)] ">
    <img src="./assets/image.png" alt="">

</div>

</body>
</html>
